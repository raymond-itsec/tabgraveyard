<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#28352c">
    <meta
      name="description"
      content="A tiny graveyard for tabs you swore you would read later."
    >
    <title>Tab Graveyard</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=10">
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="horizon"></div>
      <svg class="silhouette" viewBox="0 0 1600 220" preserveAspectRatio="xMidYEnd slice" xmlns="http://www.w3.org/2000/svg">
        <g fill="#070a06">
          <path d="M0 220 L0 196 Q60 188 110 192 Q170 196 230 188 Q300 178 360 184 Q420 190 470 184 L470 220 Z"/>
          <path d="M470 220 L470 184 L480 168 L488 168 L488 158 L496 158 L496 168 L504 168 L516 184 L560 184 L572 170 L584 170 L584 158 L590 158 L590 170 L600 170 L612 184 L660 188 Q720 192 780 184 Q860 174 940 184 Q1020 194 1100 188 Q1180 182 1260 190 Q1340 198 1420 192 Q1500 186 1600 198 L1600 220 Z"/>
          <g transform="translate(640 168)">
            <rect x="-22" y="0" width="44" height="40" rx="2"/>
            <polygon points="-26,0 0,-26 26,0"/>
            <rect x="-3" y="-44" width="6" height="22"/>
            <rect x="-9" y="-38" width="18" height="6"/>
            <rect x="-6" y="14" width="12" height="22" fill="#11150f"/>
          </g>
          <g transform="translate(200 158)" fill="#0a0d08">
            <rect x="-1.4" y="0" width="2.8" height="62"/>
            <path d="M0 8 Q-22 -2 -32 -22 M0 14 Q22 6 32 -12 M0 24 Q-18 18 -28 4 M0 30 Q20 24 28 12 M0 40 Q-14 36 -22 26 M0 46 Q16 42 22 32" stroke="#0a0d08" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          </g>
          <g transform="translate(1320 176)" fill="#0a0d08">
            <rect x="-1.2" y="0" width="2.4" height="44"/>
            <path d="M0 6 Q-14 -2 -22 -16 M0 12 Q14 4 22 -8 M0 22 Q-12 16 -20 6 M0 28 Q12 22 18 12" stroke="#0a0d08" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </g>
          <g transform="translate(820 192)" fill="#0a0d08">
            <rect x="-1.4" y="-8" width="2.8" height="24"/>
            <rect x="-7" y="-2" width="16" height="3"/>
          </g>
          <g transform="translate(1060 196)" fill="#0a0d08">
            <path d="M-8 0 Q-8 -14 0 -14 Q8 -14 8 0 Z"/>
          </g>
          <g transform="translate(380 196)" fill="#0a0d08">
            <rect x="-6" y="-12" width="12" height="14" rx="2"/>
          </g>
          <g transform="translate(1180 198)" fill="#0a0d08">
            <path d="M-9 0 Q-9 -10 0 -12 Q9 -10 9 0 Z"/>
            <rect x="-1.2" y="-18" width="2.4" height="8"/>
            <rect x="-4" y="-16" width="8" height="2"/>
          </g>
        </g>
      </svg>
      <div class="mist mist-one"></div>
      <div class="mist mist-two"></div>
    </div>

    <main class="shell">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="kicker">Rest in tabs</p>
          <h1 id="app-title">Tab Graveyard</h1>
          <p class="lede">
            Paste the links you promised to read later. We will give them the dignified burial they deserve.
          </p>
        </div>
        <div class="moon" aria-hidden="true"></div>
      </section>

      <section class="dashboard" aria-label="Graveyard dashboard">
        <section class="controls" aria-label="Bury a tab">
          <form class="bury-form" id="bury-form">
            <label for="url-input">URL</label>
            <div class="input-row">
              <input
                id="url-input"
                name="url"
                type="url"
                placeholder="https://example.com/that-article"
                autocomplete="url"
                required
              >
              <button type="submit">Bury Tab</button>
            </div>
            <p class="form-note" id="form-note" role="status" aria-live="polite"></p>
          </form>

          <div class="toolbar" aria-label="Graveyard controls">
            <label class="search-label" for="search-input">Search</label>
            <input id="search-input" type="search" placeholder="Find a grave...">

            <div class="segmented" role="group" aria-label="Filter graves">
              <button class="active" type="button" data-filter="all" aria-pressed="true">All</button>
              <button type="button" data-filter="fresh" aria-pressed="false">Fresh</button>
              <button type="button" data-filter="ancient" aria-pressed="false">Ancient</button>
              <button type="button" data-filter="archived" aria-pressed="false">Archive</button>
            </div>

            <button class="ghost-button" id="mass-funeral" type="button">
              Mass Funeral
            </button>
          </div>
        </section>

        <section class="stats" aria-label="Graveyard statistics">
          <div>
            <span id="grave-count">0</span>
            <small>buried</small>
          </div>
          <div>
            <span id="ancient-count">0</span>
            <small>ancient</small>
          </div>
          <div>
            <span id="haunt-count">0</span>
            <small>haunting later</small>
          </div>
        </section>
      </section>

      <section class="graveyard" id="graveyard" aria-live="polite"></section>
      <template id="grave-template">
        <article class="grave">
          <div class="grave-marker">
            <div class="stone-top" aria-hidden="true"></div>
            <div class="grave-content">
              <span class="moss moss-tl" aria-hidden="true"></span>
              <span class="moss moss-br" aria-hidden="true"></span>
              <span class="crack" aria-hidden="true"></span>
              <p class="grave-label">Here lies</p>
              <h2></h2>
              <a class="grave-url" target="_blank" rel="noreferrer"></a>
              <p class="epitaph"></p>
              <p class="buried"></p>
              <p class="haunt-date"></p>
              <div class="grave-actions">
                <button type="button" data-action="resurrect">Resurrect</button>
                <button type="button" data-action="archive">Archive</button>
                <button type="button" data-action="haunt">Haunt Me Later</button>
              </div>
            </div>
          </div>
          <div class="grave-tuft" aria-hidden="true"></div>
        </article>
      </template>
    </main>

    <script src="./app.js?v=10" defer></script>
  </body>
</html>
